name: Build Smooth Sprint Fix 1.21.1

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build mod
        run: gradle -p smooth-sprint-fix clean build --no-daemon

      - name: Show artifacts
        run: ls -lah smooth-sprint-fix/build/libs

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SmoothSprintFix-neoforge-1.21.1
          path: |
            smooth-sprint-fix/build/libs/*.jar
            !smooth-sprint-fix/build/libs/*-sources.jar
          if-no-files-found: error
          compression-level: 0
